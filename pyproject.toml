[project]
name = "w1-roadformer"
version = "0.1.0"
description = "W1-RoadFormer: road semantic segmentation for Wuhan-1 imagery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pillow>=9.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["segmentation*"]
